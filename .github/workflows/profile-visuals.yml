name: Profile Visuals

on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Shanghai (next day)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  generate:
    name: Generate contribution visuals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: shunwendongan
          outputs: |
            dist/github-snake.svg?color_snake=#22D3EE&color_dots=#EBEDF0,#C4B5FD,#A78BFA,#7C3AED,#22D3EE
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161B22,#312E81,#5B21B6,#7C3AED,#22D3EE

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shunwendongan

      - name: Commit generated visuals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist profile-3d-contrib

          if git diff --cached --quiet; then
            echo "No visual changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh profile visuals"
          git push
